<!DOCTYPE html>
<html>
<head>
    <title>Task Manager Debugger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        pre {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            max-height: 300px;
            overflow: auto;
        }
        .debug-panel {
            margin-top: 20px;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>Task Manager Debugger</h1>
        
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">API Settings</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="apiUrl" class="form-label">API URL</label>
                            <input type="text" class="form-control" id="apiUrl" value="http://localhost:5173/api/tasks">
                        </div>
                        <button class="btn btn-primary" onclick="testGet()">Test GET</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Add Task</h5>
                    </div>
                    <div class="card-body">
                        <form id="createForm">
                            <div class="mb-3">
                                <label for="title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" value="Test Task">
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description">Test Description</textarea>
                            </div>
                            <div class="mb-3">
                                <label for="status" class="form-label">Status</label>
                                <select class="form-control" id="status">
                                    <option value="0">To Do</option>
                                    <option value="1">In Progress</option>
                                    <option value="2">Done</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="assignedTo" class="form-label">Assigned To</label>
                                <input type="text" class="form-control" id="assignedTo" value="Test User">
                            </div>
                            <button type="button" class="btn btn-success" onclick="createTask()">Create Task</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">Request Preview</h5>
                    </div>
                    <div class="card-body">
                        <h6>Request URL:</h6>
                        <pre id="requestUrl">No request made yet</pre>
                        
                        <h6>Request Body:</h6>
                        <pre id="requestBody">No request made yet</pre>
                        
                        <button class="btn btn-primary mb-2" onclick="copyRequestBody()">Copy Request Body</button>
                        
                        <h6 class="mt-3">Response:</h6>
                        <pre id="responseData">No response yet</pre>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="debug-panel mt-4">
            <h4>Try Different Request Formats</h4>
            <p>Select a different request format and try sending it again:</p>
            
            <div class="mb-3">
                <select class="form-control" id="requestFormat">
                    <option value="standard">Standard Format</option>
                    <option value="camelCase">camelCase Keys</option>
                    <option value="wrapped">Wrapped with 'task' property</option>
                    <option value="noId">Without ID field</option>
                    <option value="allStrings">All values as strings</option>
                </select>
            </div>
            
            <button class="btn btn-warning" onclick="modifyAndTryRequest()">Try This Format</button>
        </div>
    </div>
    
    <script>
        // Function to test GET request
        function testGet() {
            const apiUrl = document.getElementById('apiUrl').value;
            document.getElementById('requestUrl').textContent = `GET ${apiUrl}`;
            document.getElementById('requestBody').textContent = 'N/A (GET request)';
            
            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(text => {
                    try {
                        const json = JSON.parse(text);
                        document.getElementById('responseData').textContent = JSON.stringify(json, null, 2);
                    } catch {
                        document.getElementById('responseData').textContent = text;
                    }
                })
                .catch(error => {
                    document.getElementById('responseData').textContent = `Error: ${error.message}`;
                });
        }
        
        // Function to create a task
        function createTask() {
            const apiUrl = document.getElementById('apiUrl').value;
            const task = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                status: parseInt(document.getElementById('status').value),
                assignedTo: document.getElementById('assignedTo').value
            };
            
            sendRequest(apiUrl, task, 'standard');
        }
        
        // Function to modify the request based on selected format and try again
        function modifyAndTryRequest() {
            const apiUrl = document.getElementById('apiUrl').value;
            const format = document.getElementById('requestFormat').value;
            
            const task = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                status: parseInt(document.getElementById('status').value),
                assignedTo: document.getElementById('assignedTo').value
            };
            
            sendRequest(apiUrl, task, format);
        }
        
        // Function to send request with a specific format
        function sendRequest(apiUrl, task, format) {
            let requestBody;
            
            switch (format) {
                case 'camelCase':
                    requestBody = {
                        title: task.title,
                        description: task.description,
                        status: task.status,
                        assignedTo: task.assignedTo
                    };
                    break;
                case 'wrapped':
                    requestBody = {
                        task: {
                            title: task.title,
                            description: task.description,
                            status: task.status,
                            assignedTo: task.assignedTo
                        }
                    };
                    break;
                case 'noId':
                    requestBody = {
                        title: task.title,
                        description: task.description,
                        status: task.status,
                        assignedTo: task.assignedTo
                    };
                    break;
                case 'allStrings':
                    requestBody = {
                        title: task.title,
                        description: task.description,
                        status: task.status.toString(),
                        assignedTo: task.assignedTo
                    };
                    break;
                case 'standard':
                default:
                    requestBody = task;
                    break;
            }
            
            document.getElementById('requestUrl').textContent = `POST ${apiUrl}`;
            document.getElementById('requestBody').textContent = JSON.stringify(requestBody, null, 2);
            
            fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            })
                .then(response => {
                    let statusInfo = `Status: ${response.status} ${response.statusText}`;
                    
                    return response.text().then(text => {
                        try {
                            const json = text ? JSON.parse(text) : {};
                            return { 
                                status: statusInfo, 
                                data: JSON.stringify(json, null, 2) 
                            };
                        } catch {
                            return { 
                                status: statusInfo, 
                                data: text || '(No response body)' 
                            };
                        }
                    });
                })
                .then(result => {
                    document.getElementById('responseData').textContent = `${result.status}\n\n${result.data}`;
                })
                .catch(error => {
                    document.getElementById('responseData').textContent = `Error: ${error.message}`;
                });
        }
        
        // Function to copy request body to clipboard
        function copyRequestBody() {
            const body = document.getElementById('requestBody').textContent;
            navigator.clipboard.writeText(body)
                .then(() => {
                    alert('Request body copied to clipboard!');
                })
                .catch(err => {
                    console.error('Could not copy text: ', err);
                });
        }
    </script>
</body>
</html>
